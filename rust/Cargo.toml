[package]
name = "mellozone-core"
version = "1.0.0"
edition = "2021"
description = "Native engine for the Mello Zone Android app: networking, content parsing, offline cache and search."
license = "UNLICENSED"
publish = false

[lib]
name = "mellozone_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["tls", "gzip"] }
scraper = { version = "0.22", default-features = false }
url = "2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
# Symbols stay in the cargo output; the Android Gradle Plugin strips the
# packaged copy and ships the symbol table to Play for crash symbolication.
debug = "line-tables-only"
strip = "none"
